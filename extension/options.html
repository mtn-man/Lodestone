<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lodestone settings</title>
<style>
  body { font: 13px -apple-system, sans-serif; margin: 16px; max-width: 420px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
  button { margin-top: 16px; padding: 6px 14px; }
  #status { margin-top: 12px; }
  #status.error { color: #c62828; }
</style>
</head>
<body>
  <h1>Lodestone</h1>
  <p>Forward magnet links to a remote Transmission daemon.</p>
  <form id="options-form">
    <label for="host">Transmission host (host:port)</label>
    <input id="host" type="text" placeholder="192.168.1.50:9091" required>

    <label for="auth">Auth (user:pass, optional)</label>
    <input id="auth" type="text" placeholder="user:pass">

    <button type="submit">Save</button>
  </form>
  <div id="status"></div>
  <script src="lib/transmission-client.js"></script>
  <script src="options.js"></script>
</body>
</html>
